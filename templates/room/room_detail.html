<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Detail</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.0.0/dist/tailwind.min.css">
</head>
<body class="bg-gray-100 font-primary">
    <div class="container mx-auto p-8">
        <h1 class="text-4xl font-bold text-center text-gray-800 mb-8">{{ room.name }}</h1>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <!-- Pengecekan gambar -->
                {% if room.image %}
                    <img src="{{ room.image.url }}" alt="{{ room.name }}" class="w-full h-64 object-cover rounded-lg">
                {% else %}
                    <!-- Gambar placeholder jika tidak ada gambar -->
                    <img src="https://via.placeholder.com/500x500?text=No+Image" alt="No image available" class="w-full h-64 object-cover rounded-lg">
                {% endif %}
            </div>
            <div>
                <h2 class="text-xl font-semibold text-gray-800 mt-4">Description</h2>
                <p class="text-gray-600 mt-2">{{ room.description }}</p>
                <p class="text-gray-700 font-bold mt-4">Price: Rp. {{ room.price }}</p>

                <!-- Tombol Book Now -->
                <a href="{% url 'book_room' room.id %}" class="mt-4 inline-block px-6 py-2 text-white bg-green-600 rounded-lg hover:bg-green-700 transition">Book Now</a>
            </div>
        </div>
    </div>
</body>
</html>
